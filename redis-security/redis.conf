# Redis Configuration File
# Basic Settings
port 6379
bind 127.0.0.1
protected-mode yes

# Authentication
requirepass YourStr0ngP@ssw0rd!

# Persistence
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile "redis.log"

# Process
daemonize yes
pidfile redis.pid


